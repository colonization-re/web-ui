# Cut a release from a tag: build at the tagged version, attach the assets.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Consumers download the assets by URL. Both of these are stable contracts —
# renaming an asset breaks every project pinned to it:
#
#   .../releases/download/v1.2.0/col.css     pinned  (use this)
#   .../releases/latest/download/col.css     rolling
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The tag is the source of truth for the version. package.json is only a
      # default for local builds, so stamp it here rather than asking every
      # release to remember to bump it in a commit.
      - name: Stamp version from tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Lets a consumer verify a download it did not watch being built.
      - name: Checksums
        working-directory: dist
        run: sha256sum col.css col.min.css tokens.json > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/col.css
            dist/col.min.css
            dist/tokens.json
            dist/SHA256SUMS.txt
