<div class="col-sectionhead"><h2>Buttons</h2></div>
<div class="demo">
  <button class="col-btn">Found colony</button>
  <button class="col-btn col-btn--outline">Outline</button>
  <button class="col-btn col-btn--line">Line</button>
  <button class="col-btn col-btn--ghost">Ghost</button>
  <button class="col-btn col-btn--quiet">Quiet</button>
  <button class="col-btn col-btn--danger">Disband</button>
  <button class="col-btn" disabled>No unit selected</button>
</div>
<div class="demo">
  <button class="col-btn col-btn--sm">Small</button>
  <button class="col-btn">Default</button>
  <button class="col-btn col-btn--lg">Large</button>
  <button class="col-btn col-btn--icon col-btn--outline" aria-label="Add">+</button>
  <button class="col-btn col-btn--icon col-btn--sm col-btn--ghost" aria-label="More">⋯</button>
  <a class="col-btn col-btn--ghost" href="#buttons">Link as button</a>
</div>
<div class="demo">
  <label class="col-btn col-btn--outline col-btn--file">
    Open .SAV<input type="file" accept=".sav"></label>
  <label class="col-btn col-btn--file col-btn--sm">
    Replace<input type="file"></label>
  <span class="col-meta">tab to the file button — the label shows the focus
    ring on the hidden input's behalf</span>
</div>
<p class="col-note col-note--line"><span>The outline button is the default
  voice here — on a drawing, most things are an edge rather than a fill. Keep
  the solid one for the single action a page is actually for.</span></p>
