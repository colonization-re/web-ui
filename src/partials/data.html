<div class="col-sectionhead"><h2>Navigation and data</h2></div>
<div class="col-tabs">
  <button class="col-tab is-active">Colonies</button>
  <button class="col-tab">Units</button>
  <button class="col-tab">Trade</button>
  <button class="col-tab">Europe</button>
  <button class="col-tab">Map</button>
</div>

<div class="col-tablewrap">
  <div class="col-scroll">
    <table class="col-table col-table--ruled">
      <thead><tr>
        <th>Colony</th><th>Founded</th><th>Pop</th><th>Status</th>
        <th style="width:24%">Warehouse</th>
      </tr></thead>
      <tbody>
        <tr><td>Jamestown</td><td>1607</td><td>8</td>
          <td><span class="col-badge col-badge--ok">growing</span></td>
          <td><span class="col-meter col-meter--ticked"><i style="width:96%"></i></span></td></tr>
        <tr><td>Plymouth</td><td>1620</td><td>5</td>
          <td><span class="col-badge col-badge--brand">stable</span></td>
          <td><span class="col-meter col-meter--ticked"><i style="width:61%"></i></span></td></tr>
        <tr><td>Roanoke</td><td>1585</td><td>3</td>
          <td><span class="col-badge col-badge--warn">short of food</span></td>
          <td><span class="col-meter col-meter--ticked"><i style="width:24%"></i></span></td></tr>
        <tr><td>Fort Nassau</td><td>1614</td><td>2</td>
          <td><span class="col-badge col-badge--danger">starving</span></td>
          <td><span class="col-meter col-meter--ticked"><i style="width:7%"></i></span></td></tr>
        <tr><td>New Amsterdam</td><td>—</td><td>0</td>
          <td><span class="col-badge">not founded</span></td>
          <td><span class="col-meter col-meter--ticked"><i style="width:0%"></i></span></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="col-row">
  <span class="col-badge col-badge--ok">growing</span>
  <span class="col-badge col-badge--brand">stable</span>
  <span class="col-badge col-badge--warn">short of food</span>
  <span class="col-badge col-badge--danger">starving</span>
  <span class="col-badge">not founded</span>
  <span class="col-badge col-badge--solid">12 colonies</span>
  <span class="col-chip">Atlantic route</span>
  <span class="col-chip">34 units</span>
</div>
