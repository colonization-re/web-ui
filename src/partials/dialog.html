<dialog class="col-dialog" id="dlg">
  <div class="col-dialog-head"><h3>Disband this unit?</h3></div>
  <div class="col-dialog-body">
    <p style="margin:0 0 12px">The veteran dragoon at <code>42, 17</code> will
      be removed from the map. This cannot be undone.</p>
    <label class="col-check" style="margin:0"><input type="checkbox">
      <span>Do not ask again this session</span></label>
  </div>
  <div class="col-dialog-foot">
    <button class="col-btn col-btn--quiet" data-close>Cancel</button>
    <button class="col-btn col-btn--danger" data-close>Disband</button>
  </div>
</dialog>
